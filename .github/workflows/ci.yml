name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are free only for public repositories.
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With the features whose tests are off by default.
      - run: cargo test --workspace --features steamwire/community,steamwire/cs2
      # The machine ID and OS version are read from the real system on
      # each platform.
      - run: cargo run -p steamwire --example machine_info
      - run: cargo build -p steamwire --no-default-features --features rustls --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Not --all: steamwire-nethook is vendored.
      - run: cargo fmt -p steamwire -p steamwire-tools -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p steamwire --no-default-features --all-targets
      - run: cargo clippy -p steamwire --no-default-features --features community,cs2 --all-targets
      # Every feature: the game and web UI proto sets too. Not --all-targets:
      # checking the library and its test build at once, each with every proto
      # set, runs the runner out of memory; the tests are linted above.
      - run: cargo clippy -p steamwire --all-features --lib --examples
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The docs as docs.rs builds them: nightly, every feature, `--cfg docsrs`.
  docs-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p steamwire --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --features steamwire/community,steamwire/cs2

  vzip:
    name: VZip vs SteamKit2 (16 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p steamwire --test vzip -- --include-ignored

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p steamwire
      # The tests as a crates.io user runs them: from the packaged crate,
      # outside this workspace (they also check that the fixtures are in it).
      - name: Test the packaged crate
        run: |
          dir="$RUNNER_TEMP/package"
          mkdir -p "$dir"
          tar -xzf target/package/steamwire-*.crate -C "$dir"
          cd "$dir"/steamwire-*
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/package-test" cargo test --features community,cs2

  fuzz:
    name: fuzz (${{ matrix.target }}, 60 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [packet, key_values, manifest, compression]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
