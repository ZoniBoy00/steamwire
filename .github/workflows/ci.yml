name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The machine ID and OS version are read from the real system on
      # each platform.
      - run: cargo run -p steamwire --example machine_info
      - run: cargo build -p steamwire --no-default-features --features rustls --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Not --all: steamwire-nethook is vendored.
      - run: cargo fmt -p steamwire-protos -p steamwire -p steamwire-tools -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p steamwire --no-default-features --all-targets
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  vzip:
    name: VZip vs SteamKit2 (16 MiB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p steamwire --test vzip -- --include-ignored

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p steamwire-protos -p steamwire

  fuzz:
    name: fuzz (${{ matrix.target }}, 60 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [packet, key_values, manifest, compression]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
