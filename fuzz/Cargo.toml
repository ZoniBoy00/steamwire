[package]
name = "steamwire-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "LGPL-2.1-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
steamwire = { path = "../crates/steamwire", default-features = false }

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_values"
path = "fuzz_targets/key_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compression"
path = "fuzz_targets/compression.rs"
test = false
doc = false
bench = false
