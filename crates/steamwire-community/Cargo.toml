[package]
name = "steamwire-community"
description = "Steam's web side for steamwire: web sessions, trade offers, inventories, mobile confirmations, the mobile authenticator and wallet purchases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["steam", "trade", "steamguard", "confirmations", "steamcommunity"]
categories = ["api-bindings", "web-programming::http-client", "games"]

[features]
default = ["native-tls"]
# Passed on to steamwire and to this crate's own HTTP client.
native-tls = ["steamwire/native-tls", "reqwest/native-tls"]
rustls = ["steamwire/rustls", "reqwest/rustls"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
steamwire = { path = "../steamwire", version = "0.1.0", default-features = false }
prost.workspace = true
tokio = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.10"
hex = "0.4"
base64 = "0.23"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
