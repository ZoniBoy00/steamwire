[package]
name = "steamwire"
description = "Async Rust library for talking to the Steam network, based on SteamKit2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["steam", "steamkit", "steamkit2", "valve", "protocol"]
categories = ["api-bindings", "network-programming", "games"]
# The fixtures are only for the repository's tests.
exclude = ["tests/data", "benches"]

[features]
default = ["native-tls"]
# TLS for the WebSocket transport, the Web API and the CDN: the system's
# (SChannel, Secure Transport or OpenSSL) or rustls with the platform's
# certificate store. One of them is needed for WebSocket and HTTPS.
native-tls = ["tokio-tungstenite/native-tls", "reqwest/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-native-roots", "reqwest/rustls"]
# `client::testing::Loopback` for the other steamwire crates' tests: a client
# on channels instead of a socket. Not part of the API.
test-util = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
steamwire-protos = { path = "../steamwire-protos", version = "0.1.0" }
prost.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
flate2 = "1"
ruzstd = "0.8"
crc32fast = "1"
rand = "0.10"
rsa = { version = "0.10", features = ["getrandom", "pkcs1v15"] }
sha1 = "0.11"
hmac = "0.13"
aes = "0.9"
cbc = "0.2"
base64 = "0.23"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
# The machine ID's registry, network adapter and disk queries.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14", default-features = false }
rpassword = "7"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "codecs"
harness = false
