[package]
name = "steamwire-protos"
description = "Steam protobuf messages generated with prost, for steamwire."
keywords = ["steam", "steamkit", "protobuf", "valve"]
categories = ["api-bindings", "encoding"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The game coordinator messages of each game and the web UI services, as in
# SteamKit2 (`SteamKit2.GC.*.Internal`, `SteamKit2.WebUI.Internal`).
csgo = []
dota2 = []
tf2 = []
deadlock = []
webui = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost.workspace = true

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
