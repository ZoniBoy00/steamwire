[package]
name = "steamkit-tools"
description = "Developer tools for steamkit: a NetHook dump analyzer and a protobuf descriptor dumper (SteamKit2's NetHookAnalyzer2 and ProtobufDumper)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "steamkit-tools"
path = "src/main.rs"

[dependencies]
steamkit = { path = "../steamkit" }
steamkit-protos = { path = "../steamkit-protos" }
prost.workspace = true
prost-reflect = { version = "0.16", features = ["text-format"] }
prost-types = "0.14"
bytes = "1"

[dev-dependencies]
protoc-bin-vendored = "3"
