[package]
name = "steamwire-cs2"
description = "Counter-Strike 2's game coordinator for steamwire: inspect links and item details, profiles, matches and share codes, and the account's CS2 inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["steam", "cs2", "csgo", "inspect", "steamkit"]
categories = ["api-bindings", "games"]

[features]
default = ["native-tls"]
# Passed on to steamwire.
native-tls = ["steamwire/native-tls"]
rustls = ["steamwire/rustls"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
steamwire = { path = "../steamwire", version = "0.1.0", default-features = false }
steamwire-protos = { path = "../steamwire-protos", version = "0.1.0", features = ["csgo"] }
prost.workspace = true
tokio = { workspace = true }
thiserror = "2"
tracing = "0.1"
crc32fast = "1"

[dev-dependencies]
# The loopback client, for `Cs2::connect`'s tests.
steamwire = { path = "../steamwire", default-features = false, features = ["test-util"] }
bytes = "1"
tokio = { workspace = true, features = ["test-util"] }
qrcode = { version = "0.14", default-features = false }
